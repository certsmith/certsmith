# ==========================================
# certsmith-vhost.template.conf
# ==========================================
# Nginx vhost template for routing ACME requests
# to the 6 step-ca tier daemons.
#
# Variables are substituted at runtime by envsubst:
#   ${CR1_PORT}, ${CR2_PORT}, ${CR3_PORT}
#   ${CE1_PORT}, ${CE2_PORT}, ${CE3_PORT}
#   ${CERTSMITH_DOMAIN}, ${CERTSMITH_DATA}
# ==========================================

server {
    listen 80 default_server;
    server_name ${CERTSMITH_DOMAIN};

    # -----------------------------------------
    # Trust Portal — Static Web UI
    # -----------------------------------------
    location / {
        root /var/www/trust-portal;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # -----------------------------------------
    # Root CA Certificate Download
    # -----------------------------------------
    location = /root_ca.crt {
        alias ${CERTSMITH_DATA}/root/root_ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="certsmith-root-ca.crt"';
    }

    # -----------------------------------------
    # RSA Intermediate Tiers (CR1, CR2, CR3)
    # -----------------------------------------

    # CR1: RSA 4096-bit — Maximum Security
    location /cr1/ {
        proxy_pass https://127.0.0.1:${CR1_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CR2: RSA 3072-bit — Enterprise Standard
    location /cr2/ {
        proxy_pass https://127.0.0.1:${CR2_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CR3: RSA 2048-bit — High Performance
    location /cr3/ {
        proxy_pass https://127.0.0.1:${CR3_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------
    # ECC Intermediate Tiers (CE1, CE2, CE3)
    # -----------------------------------------

    # CE1: ECDSA P-384 — High Assurance
    location /ce1/ {
        proxy_pass https://127.0.0.1:${CE1_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CE2: ECDSA P-256 — Modern Default
    location /ce2/ {
        proxy_pass https://127.0.0.1:${CE2_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CE3: ECDSA P-521 — Ultra Security
    location /ce3/ {
        proxy_pass https://127.0.0.1:${CE3_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------
    # Health Check Endpoint
    # -----------------------------------------
    location = /healthz {
        access_log off;
        return 200 '{"status":"ok","service":"certsmith"}';
        add_header Content-Type application/json;
    }
}
