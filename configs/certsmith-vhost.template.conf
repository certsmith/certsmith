# ==========================================
# certsmith-vhost.template.conf
# ==========================================
# Nginx vhost template for routing ACME requests
# to the 6 step-ca tier daemons with Dual SSL
# (ECC + RSA) and HTTP to HTTPS redirection.
#
# Variables are substituted at runtime by envsubst:
#   ${CR1_PORT}, ${CR2_PORT}, ${CR3_PORT}
#   ${CE1_PORT}, ${CE2_PORT}, ${CE3_PORT}
#   ${CERTSMITH_DOMAIN}, ${CERTSMITH_DATA}
# ==========================================

# ------------------------------------------
# 1. HTTP Server Block (Port 80)
# ------------------------------------------
server {
    listen 80 default_server;
    server_name ${CERTSMITH_DOMAIN} localhost;

    # Root CA Certificate Download via plain HTTP
    location = /root_ca.crt {
        alias ${CERTSMITH_DATA}/root/root_ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="certsmith-root-ca.crt"';
    }

    # ACME HTTP-01 challenge passthrough
    location /.well-known/acme-challenge/ {
        root ${CERTSMITH_DATA}/challenges;
        try_files $uri =404;
    }

    # Plain HTTP Health Check (supports both /health and /healthz)
    location ~ ^/healthz?$ {
        access_log off;
        return 200 '{"status":"ok","service":"certsmith"}';
        add_header Content-Type application/json;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------
# 2. HTTPS Server Block (Port 443 - Dual SSL)
# ------------------------------------------
server {
    listen 443 ssl default_server;
    server_name ${CERTSMITH_DOMAIN} localhost;

    # Certificate 1: ECC (ECDSA P-256 via CE2)
    ssl_certificate     ${CERTSMITH_DATA}/tls/certsmith-ecc-fullchain.crt;
    ssl_certificate_key ${CERTSMITH_DATA}/tls/certsmith-ecc.key;

    # Certificate 2: RSA (RSA 3072-bit via CR2)
    ssl_certificate     ${CERTSMITH_DATA}/tls/certsmith-rsa-fullchain.crt;
    ssl_certificate_key ${CERTSMITH_DATA}/tls/certsmith-rsa.key;

    # SSL Protocols & Cipher Suites (Prioritize ECDSA for modern clients)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # -----------------------------------------
    # Server Error Forwarding to React Router UI
    # -----------------------------------------
    error_page 500 502 503 504 = /error?status=$status;

    # -----------------------------------------
    # Trust Portal — Static Web UI (SSG + SPA)
    # -----------------------------------------
    location / {
        root /var/www/trust-portal;
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }

    # -----------------------------------------
    # Static Assets Caching (Vite hashed bundles)
    # -----------------------------------------
    location /assets/ {
        root /var/www/trust-portal;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -----------------------------------------
    # Root CA Certificate Download via HTTPS
    # -----------------------------------------
    location = /root_ca.crt {
        alias ${CERTSMITH_DATA}/root/root_ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="certsmith-root-ca.crt"';
    }

    # -----------------------------------------
    # ACME HTTP-01 challenge passthrough
    # -----------------------------------------
    location /.well-known/acme-challenge/ {
        root ${CERTSMITH_DATA}/challenges;
        try_files $uri =404;
    }

    # -----------------------------------------
    # RSA Intermediate Tiers (CR1, CR2, CR3)
    # -----------------------------------------

    # CR1: RSA 4096-bit — Maximum Security
    location /cr1/ {
        proxy_pass https://127.0.0.1:${CR1_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 = @acme_error;
    }

    # CR2: RSA 3072-bit — Enterprise Standard
    location /cr2/ {
        proxy_pass https://127.0.0.1:${CR2_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 = @acme_error;
    }

    # CR3: RSA 2048-bit — High Performance
    location /cr3/ {
        proxy_pass https://127.0.0.1:${CR3_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 = @acme_error;
    }

    # -----------------------------------------
    # ECC Intermediate Tiers (CE1, CE2, CE3)
    # -----------------------------------------

    # CE1: ECDSA P-384 — High Assurance
    location /ce1/ {
        proxy_pass https://127.0.0.1:${CE1_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 = @acme_error;
    }

    # CE2: ECDSA P-256 — Modern Default
    location /ce2/ {
        proxy_pass https://127.0.0.1:${CE2_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 = @acme_error;
    }

    # CE3: ECDSA P-521 — Ultra Security
    location /ce3/ {
        proxy_pass https://127.0.0.1:${CE3_PORT}/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 = @acme_error;
    }

    # -----------------------------------------
    # ACME Problem Document Fallback (RFC 8555)
    # -----------------------------------------
    location @acme_error {
        default_type application/problem+json;
        return 502 '{"type":"urn:ietf:params:acme:error:serverInternal","detail":"Certsmith ACME intermediate daemon is unavailable or restarting.","status":502}';
    }

    # -----------------------------------------
    # Health Check Endpoint (supports both /health and /healthz)
    # -----------------------------------------
    location ~ ^/healthz?$ {
        access_log off;
        return 200 '{"status":"ok","service":"certsmith","tls":"dual-hybrid"}';
        add_header Content-Type application/json;
    }
}
