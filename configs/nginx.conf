# ==========================================
# nginx.conf — Certsmith Core Nginx Configuration
# ==========================================
# Optimized for reverse-proxying 6 step-ca ACME daemons
# inside a single container.
# ==========================================

user certsmith;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip (for Trust Portal static assets)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Upstream definitions for all 6 step-ca ACME tiers
    # Ports are hardcoded here because nginx.conf is copied at build time.
    # The vhost template uses envsubst for the dynamic parts.

    # Include site configurations
    include /etc/nginx/sites-enabled/*.conf;
}
