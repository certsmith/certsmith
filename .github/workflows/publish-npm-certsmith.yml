name: Publish certsmith CLI to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.1). Leave empty to use package.json version."
        required: false
        default: ""
  push:
    tags:
      - "cli-v*.*.*"

jobs:
  publish:
    name: Build & Publish to npmjs (OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set custom version (if provided via dispatch)
        if: ${{ github.event.inputs.version != '' }}
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version
        working-directory: packages/cli

      - name: Extract version from tag (if tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/cli-v') }}
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#cli-v}
          npm version ${TAG_VERSION} --no-git-tag-version
        working-directory: packages/cli

      - name: Typecheck CLI package
        run: pnpm --filter certsmith run typecheck

      - name: Build CLI package
        run: pnpm --filter certsmith run build

      - name: Publish to npm (OIDC Trusted Publishing)
        run: pnpm --filter certsmith publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
